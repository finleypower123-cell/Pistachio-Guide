name: Live site check
on:
  push:
    branches: [diag/live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://pistachio-guide.vercel.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
            UA="PistachioGuide/0.1 (+https://github.com/finleypower123-cell/Pistachio-Guide)"
            BUA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
            A='(around:3000,50.84500,4.35000)'
            Q="[out:json][timeout:25];(nwr$A[\"amenity\"=\"cafe\"][\"name\"];nwr$A[\"leisure\"~\"^(park|garden|water_park|bowling_alley|miniature_golf|amusement_arcade|escape_game|trampoline_park|sports_centre)\$\"][\"name\"];nwr$A[\"leisure\"=\"swimming_pool\"][\"name\"][\"access\"!~\"^(private|no|customers)\$\"];nwr$A[\"amenity\"~\"^(cinema|theatre|arts_centre|marketplace)\$\"][\"name\"];nwr$A[\"tourism\"~\"^(museum|gallery|attraction|viewpoint)\$\"][\"name\"];nwr$A[\"shop\"~\"^(second_hand|charity|games)\$\"][\"name\"];nwr$A[\"sport\"=\"climbing\"][\"name\"];);out center tags 250;"
            LIGHT='[out:json][timeout:10];node(around:500,50.845,4.35)["amenity"="cafe"]["name"];out 5;'
            probe() { # label url ua query
              echo "-- $1"
              curl -sS -m 70 -D /tmp/h -o /tmp/b -w "HTTP %{http_code} in %{time_total}s size %{size_download}\n" -A "$3" -H "Origin: $BASE" -H "Referer: $BASE/" --data-urlencode "data=$4" "$2" || true
              grep -i "access-control-allow-origin" /tmp/h || echo "(no CORS header)"
              python3 -c "import json;d=json.load(open('/tmp/b'));print('elements',len(d.get('elements',[])),d.get('remark',''))" 2>/dev/null || (head -c 200 /tmp/b | tr '\n' ' '; echo)
              rm -f /tmp/b /tmp/h
            }
            echo "## Overpass servers, full query"
            probe "overpass-api.de appUA" https://overpass-api.de/api/interpreter "$UA" "$Q"
            probe "overpass-api.de browserUA" https://overpass-api.de/api/interpreter "$BUA" "$Q"
            probe "private.coffee browserUA" https://overpass.private.coffee/api/interpreter "$BUA" "$Q"
            probe "openstreetmap.fr" https://overpass.openstreetmap.fr/api/interpreter "$BUA" "$Q"
            probe "nchc.org.tw" https://overpass.nchc.org.tw/api/interpreter "$BUA" "$Q"
            probe "z.overpass-api.de" https://z.overpass-api.de/api/interpreter "$BUA" "$Q"
            probe "lz4.overpass-api.de" https://lz4.overpass-api.de/api/interpreter "$BUA" "$Q"
            probe "maps.mail.ru" https://maps.mail.ru/osm/tools/overpass/api/interpreter "$BUA" "$Q"
            echo "## Light query"
            probe "overpass-api.de light" https://overpass-api.de/api/interpreter "$BUA" "$LIGHT"
            probe "private.coffee light" https://overpass.private.coffee/api/interpreter "$BUA" "$LIGHT"
            echo "## Nominatim amenity search"
            curl -sS -m 30 -A "$UA" -w "\nHTTP %{http_code} in %{time_total}s\n" "https://nominatim.openstreetmap.org/search?amenity=cafe&viewbox=4.31,50.87,4.39,50.82&bounded=1&format=jsonv2&extratags=1&limit=40" | python3 -c "import sys,json;t=sys.stdin.read();i=t.rfind('\nHTTP');print(t[i:]);d=json.loads(t[:i]);print(len(d),'results');print(json.dumps(d[0])[:500])" || true
            echo "## Photon reverse"
            curl -sS -m 30 -A "$UA" -w "\nHTTP %{http_code} in %{time_total}s\n" "https://photon.komoot.io/reverse?lat=50.845&lon=4.35&radius=3&limit=50&osm_tag=amenity:cafe" | tail -c 500 || true
            echo "## Browser test"
            npm i --no-save playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
            node diag/check.cjs
          } > /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt
          python3 - <<'PY'
          import json
          t=open('/tmp/out.txt').read()[-60000:]
          json.dump({"body":"```\n"+t+"\n```"},open('/tmp/c.json','w'))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/c.json --jq .html_url
