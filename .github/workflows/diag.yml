name: Live check
on:
  push:
    branches: [diag/live-check2]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        run: |
          {
            npm ci >/dev/null 2>&1
            npm run build >/dev/null 2>&1 && (npm start >/tmp/server.log 2>&1 &) && sleep 6
            npm i --no-save playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
            node diag/check.cjs
          } > /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt
          python3 - <<'PY'
          import json
          t=open('/tmp/out.txt').read()[-60000:]
          json.dump({"body":"```\n"+t+"\n```"},open('/tmp/c.json','w'))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/c.json --jq .html_url
